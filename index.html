<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Blackjack Simulator & Trainer</title>
    
</head>
<body>
    <h1>Blackjack Engine</h1>
    
    <div id="game-board">
        <h2>Dealer</h2>
        <div id="dealer-cards"></div>
        
        <h2>Player</h2>
        <div id="player-cards"></div>
        <h3>Total: <span id="player-total">0</span></h3>
        
        <div id="controls">
            <button id="deal-btn">Deal</button>
            <button id="hit-btn" disabled>Hit</button>
            <button id="stand-btn" disabled>Stand</button>
            <button id="double-btn" disabled>Double</button>
        </div>
    </div>

    <script type="module" src="/js/main.js"></script>
</body>
</html>
